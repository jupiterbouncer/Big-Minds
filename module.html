<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mentorship Module | Big Minds</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-[#FDFBF7] text-[#1E1B4B] antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <header id="siteHeader"></header>

  <main id="moduleWorkspace" class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-6">
    <!-- A. Module Introduction -->
    <section id="moduleIntroSection"></section>

    <!-- B. Six-Stage Adaptive Navigation -->
    <section id="moduleStageNav"></section>

    <!-- C. Active Stage Main Content -->
    <section id="moduleStageCard" class="bg-white rounded-3xl border-2 border-[#1E1B4B] p-5 sm:p-8 shadow-[5px_5px_0px_#1E1B4B]">
      <!-- Rendered dynamically by moduleApp.js -->
    </section>

    <!-- D. Progress & Previous / Next Controls -->
    <section id="moduleStageFooter" class="bg-white rounded-2xl border-2 border-[#1E1B4B] p-4 shadow-[4px_4px_0px_#1E1B4B]">
      <!-- Rendered dynamically by moduleApp.js -->
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script src="js/firebaseConfig.js"></script>
  <script src="js/currencyHelper.js"></script>
  <script src="js/firebaseSync.js"></script>
  <script src="js/surveysAndBadges.js"></script>
  <script src="js/mentorshipData.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/moduleApp.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
