<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pathway Explorer | Discover Your Curiosity</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- TOP HEADER -->
  <header class="bg-white/80 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 px-4 md:px-8 py-3.5">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center text-white font-extrabold text-xl shadow-md shadow-indigo-200">
            🧭
          </div>
          <div>
            <h1 class="text-xl font-black tracking-tight text-slate-800">Pathway Explorer</h1>
            <p class="text-xs font-semibold text-slate-400">Big Minds Skill Discovery</p>
          </div>
        </div>
        <button id="mobileQuizBtn" class="md:hidden text-xs font-bold bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-full border border-indigo-200">
          ✨ Take Quiz
        </button>
      </div>

      <!-- Progress Meter -->
      <div class="flex items-center gap-4 bg-slate-50 border border-slate-200/90 px-4 py-2 rounded-2xl">
        <div class="text-right">
          <div class="text-xs font-bold text-slate-700">
            <span id="exploredCount">0</span> of <span id="totalNodesCount">0</span> Explored
          </div>
          <div id="progressPercent" class="text-[10px] text-slate-400 font-semibold">0% Discovered</div>
        </div>
        <div class="w-24 bg-slate-200 h-2.5 rounded-full overflow-hidden">
          <div id="progressBar" class="bg-emerald-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main class="max-w-7xl w-full mx-auto px-4 md:px-8 py-4 flex-1 flex flex-col gap-4">
    
    <!-- CONTROLS & INTEREST BAR -->
    <section class="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-sm flex flex-col lg:flex-row lg:items-center justify-between gap-4">
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Select 1–3 Interests:</span>
          <button id="takeQuizBtn" class="hidden md:inline-flex text-xs font-bold text-indigo-600 hover:text-indigo-800 transition-colors items-center gap-1">
            <span>✨ Unsure? Take 30s Curiosity Quiz</span>
          </button>
        </div>
        <div id="interestBadges" class="flex flex-wrap gap-2">
          <!-- Dynamically populated by app.js -->
        </div>
      </div>

      <div class="flex items-center justify-between lg:justify-end gap-2 border-t lg:border-t-0 pt-3 lg:pt-0 border-slate-100">
        <button id="resetViewBtn" class="text-xs font-bold text-slate-500 hover:text-slate-800 bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded-xl transition-colors">
          🎯 Reset Map
        </button>
        <button id="clearStateBtn" class="text-xs font-bold text-rose-500 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 px-3 py-2 rounded-xl transition-colors">
          🔄 Reset Progress
        </button>
      </div>
    </section>

    <!-- INTERACTIVE CANVAS WORKSPACE -->
    <section class="relative flex-1 min-h-[520px] bg-slate-100/70 rounded-3xl border border-slate-200/90 overflow-hidden shadow-inner flex flex-col">
      <div id="canvasViewport" class="absolute inset-0 cursor-grab active:cursor-grabbing select-none overflow-hidden">
        <div id="canvasTransform" class="absolute inset-0 origin-top-left">
          <!-- Background SVG for connecting edges -->
          <svg id="svgCanvas" class="absolute top-0 left-0 w-[2000px] h-[1500px] pointer-events-none">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8" />
              </marker>
              <marker id="arrow-active" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366F1" />
              </marker>
            </defs>
          </svg>

          <!-- Nodes container -->
          <div id="nodesContainer" class="absolute top-0 left-0 w-[2000px] h-[1500px]">
            <!-- Node cards injected here -->
          </div>
        </div>
      </div>

      <!-- Zoom UI Controls -->
      <div class="absolute bottom-4 right-4 bg-white/90 backdrop-blur-md rounded-2xl border border-slate-200/80 shadow-lg p-1.5 flex items-center gap-1 z-20">
        <button id="zoomInBtn" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 font-extrabold text-slate-700 flex items-center justify-center transition-colors">+</button>
        <button id="zoomOutBtn" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 font-extrabold text-slate-700 flex items-center justify-center transition-colors">-</button>
      </div>
    </section>
  </main>

  <!-- NODE DISCOVERY DRAWER -->
  <div id="drawerBackdrop" class="fixed inset-0 bg-slate-900/30 backdrop-blur-xs z-40 hidden opacity-0 transition-opacity duration-300"></div>
  <aside id="nodeDrawer" class="fixed inset-y-0 right-0 w-full max-w-md bg-white border-l border-slate-200 shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-out flex flex-col justify-between p-6 overflow-y-auto">
    <div>
      <div class="flex items-center justify-between mb-4">
        <span class="text-xs font-black uppercase tracking-wider text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100">
          Pathway Discovery
        </span>
        <button id="closeDrawerBtn" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold flex items-center justify-center transition-colors">
          ✕
        </button>
      </div>

      <h2 id="drawerTitle" class="text-2xl font-black text-slate-800 mb-2">Node Title</h2>
      <p id="drawerDesc" class="text-slate-600 text-sm leading-relaxed mb-6">Node Description</p>

      <div class="mb-6">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Related Interests</h3>
        <div id="drawerTags" class="flex flex-wrap gap-2"></div>
      </div>

      <!-- MICRO ACTIVITY CHALLENGE -->
      <div class="bg-gradient-to-br from-indigo-50/80 to-slate-50 border border-indigo-100 rounded-2xl p-5 mb-6">
        <div class="flex items-center justify-between mb-2">
          <h3 id="activityTitle" class="font-bold text-indigo-950 text-sm flex items-center gap-1.5">
            ⚡ Try Something
          </h3>
          <span id="activityBadge" class="text-[10px] font-extrabold uppercase bg-indigo-200 text-indigo-800 px-2 py-0.5 rounded-full">
            Interactive
          </span>
        </div>
        <p id="activityDesc" class="text-xs text-indigo-900/80 leading-relaxed mb-4">Activity details</p>

        <!-- Dynamic Challenge UI Sandbox -->
        <div id="activitySandbox" class="bg-white rounded-xl border border-indigo-100 p-3 shadow-xs">
          <!-- Interactive widgets injected here by app.js -->
        </div>
      </div>
    </div>

    <div class="pt-4 border-t border-slate-100 flex flex-col gap-2">
      <button id="toggleExploredBtn" class="w-full py-3.5 px-4 rounded-2xl font-extrabold text-sm transition-all shadow-md bg-indigo-600 hover:bg-indigo-700 text-white shadow-indigo-200">
        Mark as Explored
      </button>
    </div>
  </aside>

  <!-- CURIOSITY QUIZ MODAL -->
  <div id="quizModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl border border-slate-200 shadow-2xl w-full max-w-lg p-6 flex flex-col gap-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 class="font-black text-slate-800 text-lg">Curiosity Quiz</h3>
        <button id="closeQuizBtn" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
      </div>

      <div id="quizBody" class="py-2">
        <!-- Quiz questions injected here -->
      </div>

      <div class="flex justify-end gap-2 border-t border-slate-100 pt-3">
        <button id="submitQuizBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl transition-all shadow-md shadow-indigo-200">
          Apply Suggested Interests
        </button>
      </div>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script src="js/pathwaysData.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
