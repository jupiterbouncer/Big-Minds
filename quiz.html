<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Curiosity Discovery Quiz | Big Minds</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-[#FAF8F5] text-slate-900 antialiased min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- HEADER -->
  <header class="bg-white/95 backdrop-blur-md border-b-2 border-slate-900 sticky top-0 z-30 px-4 md:px-8 py-3 shadow-xs">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5 hover:opacity-90 transition-opacity">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 border-2 border-slate-900 flex items-center justify-center text-white font-extrabold text-xl shadow-[2px_2px_0px_#0F172A]">
          💡
        </div>
        <div>
          <span class="text-lg font-black tracking-tight text-slate-900">Big Minds</span>
          <span class="text-[10px] font-black uppercase bg-amber-300 text-slate-900 px-1.5 py-0.5 rounded border border-slate-900 ml-1.5">Quiz</span>
        </div>
      </a>

      <a href="index.html" class="text-xs font-black text-slate-700 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 border-2 border-slate-900 px-3 py-1.5 rounded-xl transition-all shadow-[2px_2px_0px_#0F172A]">
        ← Back to Pathway Map
      </a>
    </div>
  </header>

  <!-- MAIN QUIZ CONTENT -->
  <main class="max-w-3xl w-full mx-auto px-4 py-6 flex-1 flex flex-col justify-center">

    <!-- Hero / Progress Header -->
    <div class="bg-white rounded-3xl border-2 border-slate-900 p-5 md:p-7 shadow-[4px_4px_0px_#0F172A] mb-5">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-4">
        <div>
          <h1 class="text-2xl md:text-3xl font-black text-slate-900 font-heading">Discover Your Curiosities ✨</h1>
          <p class="text-xs md:text-sm text-slate-600 font-bold mt-1">Answer 6 focused questions to explore which mentorship pathways best match your strengths.</p>
        </div>
        <div class="flex items-center gap-2 self-start md:self-auto bg-amber-50 border border-amber-300 px-3 py-1.5 rounded-xl text-xs font-black text-amber-900">
          <span>⏱️ Takes ~45 secs</span>
        </div>
      </div>
      <p id="quizProgress" class="text-xs font-black text-indigo-700 mb-3" aria-live="polite"></p>

      <!-- Quiz Form Container -->
      <form id="standaloneQuizForm" class="space-y-6">
        <div id="quizQuestionsContainer" class="space-y-6">
          <!-- Dynamically populated -->
        </div>

        <!-- Submit & Actions -->
        <div class="pt-4 border-t-2 border-slate-200 flex flex-col sm:flex-row gap-3 items-center justify-between">
          <button type="button" id="clearQuizBtn" class="w-full sm:w-auto text-xs font-black text-slate-600 hover:text-slate-900 px-4 py-2.5 rounded-xl border border-slate-300 transition-colors">
            Reset Answers
          </button>
          <div class="flex w-full sm:w-auto gap-2">
            <button type="button" id="previousQuestionBtn" class="hidden flex-1 sm:flex-none text-xs font-black text-slate-700 bg-slate-100 border-2 border-slate-900 px-4 py-3 rounded-xl">← Previous</button>
            <button type="button" id="nextQuestionBtn" class="flex-1 sm:flex-none bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm px-6 py-3.5 rounded-2xl border-2 border-slate-900 shadow-[3px_3px_0px_#0F172A] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all">Next Question →</button>
            <button type="submit" id="submitStandaloneQuiz" class="hidden flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm px-6 py-3.5 rounded-2xl border-2 border-slate-900 shadow-[3px_3px_0px_#0F172A] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all">🚀 Reveal Matched Pathways</button>
          </div>
        </div>
      </form>
    </div>

  </main>

  <footer class="border-t border-slate-200 bg-white/70 px-4 py-3 text-center text-xs text-slate-500 font-semibold">
    Big Minds • Student Interest Exploration & Future Pathways Platform
  </footer>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Application Logic -->
  <script src="js/firebaseConfig.js"></script>
  <script src="js/currencyHelper.js"></script>
  <script src="js/firebaseSync.js"></script>
  <script src="js/surveysAndBadges.js"></script>
  <script src="js/pathwaysData.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('quizQuestionsContainer');
      const form = document.getElementById('standaloneQuizForm');
      const clearBtn = document.getElementById('clearQuizBtn');
      const progress = document.getElementById('quizProgress');
      const previousBtn = document.getElementById('previousQuestionBtn');
      const nextBtn = document.getElementById('nextQuestionBtn');
      const submitBtn = document.getElementById('submitStandaloneQuiz');
      let currentQuestion = 0;
      const answers = {};

      function renderQuestion() {
        const q = QUIZ_QUESTIONS[currentQuestion];
        const card = document.createElement('div');
        card.className = 'bg-slate-50/70 rounded-2xl border-2 border-slate-900 p-4 shadow-[2px_2px_0px_#0F172A]';
        card.innerHTML = `
          <div class="flex items-center gap-2 mb-3">
            <span class="w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-black flex items-center justify-center shrink-0">${currentQuestion + 1}</span>
            <h2 class="text-sm md:text-base font-black text-slate-900">${q.question}</h2>
          </div>
          <div class="space-y-2">
            ${q.options.map((opt, optIdx) => {
              const selected = answers[q.id] === optIdx;
              return `<label class="flex items-center gap-3 p-3 rounded-xl border-2 ${selected ? 'border-indigo-600 bg-indigo-100' : 'border-slate-300 bg-white hover:bg-indigo-50/50'} cursor-pointer text-xs md:text-sm font-bold text-slate-800 transition-all select-none quiz-option">
                <input type="radio" name="question_${q.id}" value="${optIdx}" class="w-4 h-4 text-indigo-600 accent-indigo-600" ${selected ? 'checked' : ''} />
                <span>${opt.text}</span>
              </label>`;
            }).join('')}
          </div>`;
        container.replaceChildren(card);
        progress.textContent = `Question ${currentQuestion + 1} of ${QUIZ_QUESTIONS.length}`;
        previousBtn.classList.toggle('hidden', currentQuestion === 0);
        nextBtn.classList.toggle('hidden', currentQuestion === QUIZ_QUESTIONS.length - 1);
        submitBtn.classList.toggle('hidden', currentQuestion !== QUIZ_QUESTIONS.length - 1);
        card.querySelectorAll('input[type="radio"]').forEach((input) => input.addEventListener('change', () => {
          answers[q.id] = Number(input.value);
          renderQuestion();
        }));
      }

      function requireAnswer() {
        if (answers[QUIZ_QUESTIONS[currentQuestion].id] !== undefined) return true;
        alert('Choose an answer before continuing to the next question.');
        return false;
      }

      clearBtn?.addEventListener('click', () => {
        Object.keys(answers).forEach((key) => delete answers[key]);
        currentQuestion = 0;
        renderQuestion();
      });
      previousBtn?.addEventListener('click', () => { currentQuestion -= 1; renderQuestion(); });
      nextBtn?.addEventListener('click', () => { if (requireAnswer()) { currentQuestion += 1; renderQuestion(); } });
      renderQuestion();

      // Submit handler
      form.addEventListener('submit', (e) => {
        e.preventDefault();

        if (!requireAnswer() || Object.keys(answers).length !== QUIZ_QUESTIONS.length) {
          alert('Please answer all questions before submitting.');
          return;
        }

        const tagScores = {};
        QUIZ_QUESTIONS.forEach((q, qIndex) => {
          const selectedIdx = answers[q.id];
          const tags = QUIZ_QUESTIONS[qIndex]?.options[selectedIdx]?.tags || [];
          tags.forEach(t => {
            tagScores[t] = (tagScores[t] || 0) + 1;
          });
        });

        const sorted = Object.entries(tagScores).sort((a, b) => b[1] - a[1]);
        const topInterests = sorted.slice(0, 3).map(entry => entry[0]);

        // Load existing session or generate
        let session = {};
        try {
          const saved = localStorage.getItem('bigminds_student_session');
          if (saved) session = JSON.parse(saved);
        } catch (err) {}

        if (!session.participantId) {
          session.participantId = 'bm_part_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 5);
        }

        session.activeInterests = topInterests;
        if (!Array.isArray(session.unlockedBadges)) session.unlockedBadges = [];
        if (!session.unlockedBadges.includes('curiosity-pioneer')) {
          session.unlockedBadges.push('curiosity-pioneer');
        }

        localStorage.setItem('bigminds_student_session', JSON.stringify(session));

        // Persist to Firebase RTDB
        if (window.FirebaseSync && typeof window.FirebaseSync.saveQuizSubmission === 'function') {
          window.FirebaseSync.saveQuizSubmission(session.participantId, {
            answers: answers,
            scores: tagScores,
            preferredAreas: topInterests,
            quizVersion: '2.0'
          }).finally(() => {
            window.location.href = 'index.html?fromQuiz=true';
          });
        } else {
          window.location.href = 'index.html?fromQuiz=true';
        }
      });
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch((err) => console.warn('Service worker registration failed:', err)));
    }
  </script>
</body>
</html>
